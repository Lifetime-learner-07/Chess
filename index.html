<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Chess with Eval Bar & Bot</title>

  <!-- Chessboard CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1b1b1b;
      color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      user-select: none;
    }

    .game-wrapper {
      display: flex;
      flex-direction: row;
      background: #262421;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      max-width: 830px;
      width: 100%;
    }

    /* Left Side: Board, Eval Bar, and Player Bars */
    .board-section {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 436px;
      padding: 6px 12px;
      background: #1e1c19;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #bbb;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .clock {
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: bold;
      background: #121110;
      color: #777;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #333;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .clock.active {
      background: #2a2824;
      border-color: #81b64c;
      color: #81b64c;
    }

    .clock.low-time {
      border-color: #f87171 !important;
      color: #f87171 !important;
    }

    /* BOARD + EVAL BAR CONTAINER */
    .board-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* EVALUATION BAR */
    .eval-bar-wrapper {
      width: 24px;
      height: 400px;
      background-color: #312e2b; /* Black's territory */
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column-reverse; /* Fills up from bottom (White's territory) */
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
    }

    .eval-fill {
      width: 100%;
      height: 50%;
      background-color: #ffffff; /* White's territory */
      transition: height 0.4s ease-out;
    }

    .eval-score-text {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 800;
      font-family: monospace;
      left: 0;
      z-index: 5;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    #myBoard {
      width: 400px;
      border-radius: 4px;
      overflow: hidden;
    }

    .status-badge {
      font-size: 0.9rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      background: #33312e;
      color: #81b64c;
      border: 1px solid #403d39;
    }

    .status-badge.check {
      color: #f87171;
      border-color: #f87171;
    }

    /* Move Highlights */
    .highlight-square {
      background-color: rgba(246, 230, 89, 0.6) !important;
    }

    .legal-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background-color: rgba(0, 0, 0, 0.28);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }

    .legal-capture::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      border: 4px solid rgba(0, 0, 0, 0.28);
      border-radius: 50%;
      pointer-events: none;
      box-sizing: border-box;
      z-index: 5;
    }

    .premove-square {
      background-color: rgba(235, 97, 80, 0.72) !important;
    }

    /* Right Side Panel */
    .side-panel {
      background: #211f1c;
      border-left: 1px solid #33312e;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      justify-content: space-between;
      gap: 16px;
    }

    .panel-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ccc;
    }

    .difficulty-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .difficulty-group label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    select.difficulty-select {
      background: #191816;
      color: #f1f1f1;
      border: 1px solid #403d39;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    select.difficulty-select:focus {
      border-color: #81b64c;
    }

    .history-box {
      flex: 1;
      max-height: 280px;
      overflow-y: auto;
      background: #1b1917;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .move-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .move-row:nth-child(even) {
      background: #23211e;
    }

    .move-number {
      color: #777;
      width: 35px;
    }

    .move-white, .move-black {
      width: 60px;
    }

    .move-white {
      color: #fff;
    }

    .move-black {
      color: #aaa;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      background-color: #81b64c;
      color: #fff;
      border: none;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #96c95d;
    }

    button.secondary {
      background-color: #403d39;
      color: #ccc;
    }

    button.secondary:hover {
      background-color: #524f4a;
      color: #fff;
    }

    @media (max-width: 650px) {
      .game-wrapper {
        flex-direction: column;
      }
      .player-bar {
        width: 348px;
      }
      .eval-bar-wrapper {
        height: 320px;
      }
      #myBoard {
        width: 320px;
      }
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- Left: Board, Eval Bar, and Clocks -->
    <div class="board-section">
      <div class="player-bar">
        <div class="player-info">
          <span id="botLabel">🤖 Bot (Medium)</span>
        </div>
        <div id="blackClock" class="clock">05:00</div>
      </div>

      <div class="board-area">
        <!-- Live Advantage Eval Bar -->
        <div class="eval-bar-wrapper">
          <div id="evalScore" class="eval-score-text">0.0</div>
          <div id="evalFill" class="eval-fill"></div>
        </div>

        <div id="myBoard"></div>
      </div>

      <div class="player-bar">
        <div class="player-info">
          <span>👤 You (White)</span>
        </div>
        <div id="whiteClock" class="clock">05:00</div>
      </div>

      <div id="status" class="status-badge">Your turn (White)</div>
    </div>

    <!-- Right: Settings, Move History, Controls -->
    <div class="side-panel">
      <div class="panel-header">
        <div class="difficulty-group">
          <label for="difficultySelect">Opponent Level</label>
          <select id="difficultySelect" class="difficulty-select">
            <option value="easy">Easy (Beginner ~800)</option>
            <option value="medium" selected>Medium (Intermediate ~1400)</option>
            <option value="hard">Hard (Advanced ~1800)</option>
          </select>
        </div>

        <div class="panel-title">Move History</div>
      </div>

      <div class="history-box" id="moveHistory"></div>

      <div class="controls">
        <button id="restartBtn">New Game</button>
        <button id="flipBtn" class="secondary">Flip</button>
      </div>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    const game = new Chess();
    const statusEl = document.getElementById('status');
    const historyEl = document.getElementById('moveHistory');
    const whiteClockEl = document.getElementById('whiteClock');
    const blackClockEl = document.getElementById('blackClock');
    const botLabelEl = document.getElementById('botLabel');
    const difficultySelectEl = document.getElementById('difficultySelect');
    const evalFillEl = document.getElementById('evalFill');
    const evalScoreEl = document.getElementById('evalScore');
    const boardEl = $('#myBoard');

    const moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3');
    const captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3');

    let selectedSquare = null;
    let queuedPremove = null;

    // --- 1. CLOCK ENGINE ---
    const INITIAL_TIME = 300; // 5 min
    let whiteTime = INITIAL_TIME;
    let blackTime = INITIAL_TIME;
    let timerInterval = null;
    let clockRunning = false;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateClockDisplay() {
      whiteClockEl.innerText = formatTime(whiteTime);
      blackClockEl.innerText = formatTime(blackTime);

      whiteClockEl.classList.toggle('low-time', whiteTime <= 30);
      blackClockEl.classList.toggle('low-time', blackTime <= 30);

      if (!game.game_over() && clockRunning) {
        if (game.turn() === 'w') {
          whiteClockEl.classList.add('active');
          blackClockEl.classList.remove('active');
        } else {
          blackClockEl.classList.add('active');
          whiteClockEl.classList.remove('active');
        }
      } else {
        whiteClockEl.classList.remove('active');
        blackClockEl.classList.remove('active');
      }
    }

    function startClock() {
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (game.game_over()) {
          clearInterval(timerInterval);
          return;
        }

        if (game.turn() === 'w') {
          whiteTime--;
          if (whiteTime <= 0) {
            whiteTime = 0;
            handleTimeout('White');
          }
        } else {
          blackTime--;
          if (blackTime <= 0) {
            blackTime = 0;
            handleTimeout('Black');
          }
        }
        updateClockDisplay();
      }, 1000);

      clockRunning = true;
      updateClockDisplay();
    }

    function handleTimeout(playerWhoTimedOut) {
      clearInterval(timerInterval);
      clockRunning = false;
      cancelPremove();
      const winner = playerWhoTimedOut === 'White' ? 'Black (Bot)' : 'You (White)';
      statusEl.innerText = `${playerWhoTimedOut} ran out of time! ${winner} wins!`;
      statusEl.classList.add('check');
    }

    // --- 2. BOARD EVALUATION & ADVANTAGE BAR ---
    const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    const centerSquares = ['d4', 'd5', 'e4', 'e5', 'c4', 'c5', 'f4', 'f5'];

    function evaluateBoard(chessInstance) {
      let totalScore = 0;
      const board = chessInstance.board();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = board[r][c];
          if (!piece) continue;

          let value = pieceValues[piece.type];
          const squareName = String.fromCharCode(97 + c) + (8 - r);
          if ((piece.type === 'p' || piece.type === 'n') && centerSquares.includes(squareName)) {
            value += 20;
          }
          totalScore += (piece.color === 'w' ? value : -value);
        }
      }
      return totalScore;
    }

    function updateEvalBar() {
      if (game.in_checkmate()) {
        if (game.turn() === 'w') {
          // White is checkmated -> Black won
          evalFillEl.style.height = '0%';
          evalScoreEl.innerText = '-M';
          evalScoreEl.style.top = '6px';
          evalScoreEl.style.bottom = 'auto';
          evalScoreEl.style.color = '#ffffff';
        } else {
          // Black is checkmated -> White won
          evalFillEl.style.height = '100%';
          evalScoreEl.innerText = '+M';
          evalScoreEl.style.bottom = '6px';
          evalScoreEl.style.top = 'auto';
          evalScoreEl.style.color = '#312e2b';
        }
        return;
      }

      const score = evaluateBoard(game);

      // Sigmoid/logistic scaling: 50% = equal, clamps safely between 5% and 95%
      let percentage = 50 + 50 * (score / (Math.abs(score) + 600));
      percentage = Math.max(5, Math.min(95, percentage));

      evalFillEl.style.height = `${percentage}%`;

      // Display format: e.g. +1.4 or -0.8
      const pawnScore = (score / 100).toFixed(1);
      const textScore = (score > 0 ? '+' : '') + (Math.abs(score) < 10 ? '0.0' : pawnScore);
      evalScoreEl.innerText = textScore;

      // Smart label placement (Chess.com style)
      if (percentage >= 50) {
        evalScoreEl.style.bottom = '6px';
        evalScoreEl.style.top = 'auto';
        evalScoreEl.style.color = '#312e2b'; // Dark text on white background
      } else {
        evalScoreEl.style.top = '6px';
        evalScoreEl.style.bottom = 'auto';
        evalScoreEl.style.color = '#ffffff'; // White text on dark background
      }
    }

    // --- 3. MULTI-LEVEL BOT ENGINE ---
    function minimax(chessInstance, depth, alpha, beta, isMaximizing) {
      if (depth === 0 || chessInstance.game_over()) {
        return evaluateBoard(chessInstance);
      }

      const moves = chessInstance.moves();

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < moves.length; i++) {
          chessInstance.move(moves[i]);
          const evalScore = minimax(chessInstance, depth - 1, alpha, beta, false);
          chessInstance.undo();
          maxEval = Math.max(maxEval, evalScore);
          alpha = Math.max(alpha, evalScore);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < moves.length; i++) {
          chessInstance.move(moves[i]);
          const evalScore = minimax(chessInstance, depth - 1, alpha, beta, true);
          chessInstance.undo();
          minEval = Math.min(minEval, evalScore);
          beta = Math.min(beta, evalScore);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function getBestBotMove(chessInstance) {
      const moves = chessInstance.moves({ verbose: true });
      if (moves.length === 0) return null;

      const difficulty = difficultySelectEl.value;

      // Easy Mode
      if (difficulty === 'easy') {
        if (Math.random() < 0.5) {
          return moves[Math.floor(Math.random() * moves.length)];
        }
        moves.sort(() => Math.random() - 0.5);
        let bestMove = moves[0];
        let bestVal = Infinity;
        for (let i = 0; i < moves.length; i++) {
          chessInstance.move(moves[i]);
          const val = evaluateBoard(chessInstance);
          chessInstance.undo();
          if (val < bestVal) {
            bestVal = val;
            bestMove = moves[i];
          }
        }
        return bestMove;
      }

      // Medium: Depth 2, Hard: Depth 3
      const depth = difficulty === 'hard' ? 3 : 2;

      moves.sort(() => Math.random() - 0.5);
      let bestMove = null;
      let bestValue = Infinity;

      for (let i = 0; i < moves.length; i++) {
        const move = moves[i];
        chessInstance.move(move);
        const boardValue = minimax(chessInstance, depth - 1, -Infinity, Infinity, true);
        chessInstance.undo();

        if (boardValue < bestValue) {
          bestValue = boardValue;
          bestMove = move;
        }
      }

      return bestMove;
    }

    function makeBotMove() {
      if (game.game_over() || game.turn() !== 'b' || blackTime <= 0) return;

      const bestMove = getBestBotMove(game);
      if (!bestMove) return;

      const botResult = game.move({
        from: bestMove.from,
        to: bestMove.to,
        promotion: 'q'
      });

      if (!botResult) return;

      if (botResult.captured) {
        captureSound.play();
      } else {
        moveSound.play();
      }

      updateMoveHistoryTable();

      // Check Premoves
      if (queuedPremove) {
        const pending = queuedPremove;
        queuedPremove = null;
        removePremoveHighlights();

        const premoveResult = game.move({
          from: pending.from,
          to: pending.to,
          promotion: 'q'
        });

        if (premoveResult) {
          if (premoveResult.captured) {
            captureSound.play();
          } else {
            moveSound.play();
          }
          board.position(game.fen());
          updateStatus();
          updateMoveHistoryTable();
          updateClockDisplay();
          updateEvalBar();

          if (!game.game_over() && game.turn() === 'b') {
            window.setTimeout(makeBotMove, 200);
          }
          return;
        }
      }

      board.position(game.fen());
      updateStatus();
      updateClockDisplay();
      updateEvalBar();
    }

    // --- 4. PREMOVE & HIGHLIGHT HELPERS ---
    function removeHighlights() {
      boardEl.find('.square-55d63').removeClass('highlight-square legal-dot legal-capture');
    }

    function removePremoveHighlights() {
      boardEl.find('.square-55d63').removeClass('premove-square');
    }

    function cancelPremove() {
      queuedPremove = null;
      selectedSquare = null;
      removeHighlights();
      removePremoveHighlights();
      board.position(game.fen());
    }

    function setPremove(source, target) {
      removeHighlights();
      removePremoveHighlights();
      queuedPremove = { from: source, to: target };
      boardEl.find('.square-' + source).addClass('premove-square');
      boardEl.find('.square-' + target).addClass('premove-square');
    }

    function highlightSquareAndMoves(square) {
      removeHighlights();
      boardEl.find('.square-' + square).addClass('highlight-square');

      const moves = game.moves({ square: square, verbose: true });
      moves.forEach(m => {
        const sq = boardEl.find('.square-' + m.to);
        if (m.captured) {
          sq.addClass('legal-capture');
        } else {
          sq.addClass('legal-dot');
        }
      });
    }

    function updateMoveHistoryTable() {
      const history = game.history();
      let html = '';

      for (let i = 0; i < history.length; i += 2) {
        const moveNumber = (i / 2) + 1;
        const whiteMove = history[i];
        const blackMove = history[i + 1] || '';

        html += `
          <div class="move-row">
            <span class="move-number">${moveNumber}.</span>
            <span class="move-white">${whiteMove}</span>
            <span class="move-black">${blackMove}</span>
          </div>
        `;
      }

      historyEl.innerHTML = html;
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    function makeMove(source, target) {
      if (whiteTime <= 0 || blackTime <= 0) return null;

      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return null;

      if (!clockRunning) startClock();

      if (move.captured) {
        captureSound.play();
      } else {
        moveSound.play();
      }

      board.position(game.fen());
      updateStatus();
      updateMoveHistoryTable();
      updateClockDisplay();
      updateEvalBar();

      if (game.game_over()) {
        clearInterval(timerInterval);
        clockRunning = false;
        cancelPremove();
        updateClockDisplay();
        return move;
      }

      if (game.turn() === 'b') {
        window.setTimeout(makeBotMove, 200);
      }

      return move;
    }

    // --- 5. DRAG & DROP ---
    function onDragStart(source, piece, position, orientation) {
      if (game.game_over() || whiteTime <= 0 || blackTime <= 0) return false;
      if (piece.search(/^b/) !== -1) return false;
    }

    function onDrop(source, target) {
      if (source === target) return 'snapback';

      if (game.turn() === 'w') {
        const move = makeMove(source, target);
        selectedSquare = null;
        removeHighlights();
        if (move === null) return 'snapback';
      } else {
        const piece = game.get(source);
        if (!piece || piece.color !== 'w') return 'snapback';
        setPremove(source, target);
      }
    }

    function onSnapEnd() {
      if (!queuedPremove) {
        board.position(game.fen());
      }
    }

    // --- 6. CLICK HANDLERS ---
    boardEl.on('pointerdown', '[data-square]', function (e) {
      if (game.game_over() || whiteTime <= 0 || blackTime <= 0) return;

      const clickedSquare = $(this).attr('data-square');
      const pieceOnSquare = game.get(clickedSquare);

      if (game.turn() === 'w') {
        if (!selectedSquare) {
          if (pieceOnSquare && pieceOnSquare.color === 'w') {
            selectedSquare = clickedSquare;
            highlightSquareAndMoves(clickedSquare);
          }
          return;
        }

        if (selectedSquare === clickedSquare) {
          selectedSquare = null;
          removeHighlights();
          return;
        }

        if (pieceOnSquare && pieceOnSquare.color === 'w') {
          selectedSquare = clickedSquare;
          highlightSquareAndMoves(clickedSquare);
          return;
        }

        makeMove(selectedSquare, clickedSquare);
        selectedSquare = null;
        removeHighlights();
      } else {
        if (!selectedSquare) {
          if (pieceOnSquare && pieceOnSquare.color === 'w') {
            selectedSquare = clickedSquare;
            removeHighlights();
            removePremoveHighlights();
            boardEl.find('.square-' + clickedSquare).addClass('premove-square');
          }
          return;
        }

        if (selectedSquare === clickedSquare) {
          cancelPremove();
          return;
        }

        if (pieceOnSquare && pieceOnSquare.color === 'w') {
          removePremoveHighlights();
          selectedSquare = clickedSquare;
          boardEl.find('.square-' + clickedSquare).addClass('premove-square');
          return;
        }

        const fromSq = selectedSquare;
        const toSq = clickedSquare;
        selectedSquare = null;

        setPremove(fromSq, toSq);
        board.move(fromSq + '-' + toSq);
      }
    });

    boardEl.on('contextmenu', function (e) {
      e.preventDefault();
      cancelPremove();
    });

    $(document).on('pointerdown', function (e) {
      if (!$(e.target).closest('#myBoard').length) {
        if (game.turn() === 'w') {
          selectedSquare = null;
          removeHighlights();
        }
      }
    });

    difficultySelectEl.addEventListener('change', (e) => {
      const text = e.target.options[e.target.selectedIndex].text.split(' ')[0];
      botLabelEl.innerText = `🤖 Bot (${text})`;
    });

    function updateStatus() {
      let status = '';
      statusEl.classList.remove('check');

      if (game.in_checkmate()) {
        status = 'Checkmate! ' + (game.turn() === 'w' ? 'Black (Bot)' : 'You (White)') + ' win!';
        statusEl.classList.add('check');
      } else if (game.in_draw()) {
        status = 'Draw!';
      } else {
        status = game.turn() === 'w' ? 'Your turn (White)' : 'Bot is calculating...';
        if (game.in_check()) {
          status += ' — Check!';
          statusEl.classList.add('check');
        }
      }
      statusEl.innerText = status;
    }

    const config = {
      draggable: true,
      position: 'start',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    };

    const board = Chessboard('myBoard', config);
    updateStatus();
    updateClockDisplay();
    updateEvalBar();

    // Reset Game
    document.getElementById('restartBtn').addEventListener('click', () => {
      clearInterval(timerInterval);
      clockRunning = false;
      whiteTime = INITIAL_TIME;
      blackTime = INITIAL_TIME;
      cancelPremove();
      game.reset();
      board.start();
      updateStatus();
      updateClockDisplay();
      updateEvalBar();
      updateMoveHistoryTable();
    });

    // Flip Board
    document.getElementById('flipBtn').addEventListener('click', () => {
      board.flip();
      cancelPremove();
    });
  </script>
</body>
</html>
